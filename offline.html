<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Connection problem · AICharHub</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --surface: #161614;
        --line: #2a2926;
        --text: #f5f1e8;
        --text-dim: #a8a294;
        --gold: #e0b352;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 40px 28px;
      }
      .mark {
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-dim);
        margin: 0 0 16px;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-style: italic;
        font-weight: 400;
        font-size: 28px;
        margin: 0 0 12px;
        color: var(--text);
      }
      p {
        font-size: 15px;
        line-height: 1.5;
        color: var(--text-dim);
        margin: 0 0 24px;
      }
      button {
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--bg);
        background: var(--gold);
        border: none;
        border-radius: 6px;
        padding: 12px 20px;
        min-height: 44px;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="mark">AICharHub</p>
      <h1>AICharHub couldn't be reached</h1>
      <p>The network, certificate, or hosting origin did not respond. Check the connection and try again.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
